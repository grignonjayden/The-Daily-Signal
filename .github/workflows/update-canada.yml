name: Update Canada

on:
  schedule:
    - cron: '20 10,14,18,22 * * *'   # about 5:20 AM, 9:20 AM, 1:20 PM and 5:20 PM Toronto time
  workflow_dispatch:                 # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-canada
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Canadian stats
        run: node scripts/fetch-canada.mjs
      - name: Commit canada.json if it changed
        run: |
          git config user.name "daily-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canada.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update Canada stats $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 7; done
